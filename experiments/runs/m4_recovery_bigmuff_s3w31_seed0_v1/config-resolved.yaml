campaign:
  schema_version: 1
  sample_rate: 48000
  tier: INTERNAL_DEV
  devices:
  - fulltone_full_drive_2
  - electro_harmonix_big_muff
  models:
  - B0
  - B2
  - S3
  - S4
  seeds:
  - 0
  - 1
  - 2
  context_samples: 6346
  output_samples: 8192
  batch_size: 2
  optimizer_steps: 200
  validation_interval_steps: 40
  validation_samples: 240000
  evaluation_block_samples: 8192
  optimizer:
    name: Adam
    learning_rate: 0.004
    weight_decay: 3.17e-07
  gradient_clip_norm: 1.0
  loss:
    mse: 1.0
    mrstft: 0.0005
    spline_curvature: 1.0e-05
    normalized_residual_energy: 0.001
  deterministic_mode: warn_only
  precision: float32
  checkpoint_policy: lowest_validation_esr
  preflight:
    optimizer_steps: 2
    validation_interval_steps: 1
    validation_samples: 32768
  notes:
  - Every optimizer step sees the same two 8192-sample output regions.
  - A shared 6346-sample causal context covers the official A2 receptive field.
  - M4 is a bounded smoke test and cannot establish final hypotheses.
model: S3
device: electro_harmonix_big_muff
seed: 0
preflight: false
recovery:
  schema_version: 1
  phase: M4_RECOVERY
  base_protocol: configs/training/m4_smoke.yaml
  model: S3
  residual_channels: 31
  parameters: 12192
  comparison_target_parameters: 12145
  seed: 0
  devices:
  - fulltone_full_drive_2
  - electro_harmonix_big_muff
  fixed_dimensions:
  - data
  - split
  - loss
  - context
  - optimizer
  - optimizer_steps
  - checkpoint_policy
  stop_condition:
    metric: test_esr
    required_gap_closure_fraction: 0.5
    required_on_both_devices: true
  notes:
  - This is a discriminating recovery diagnostic, not a hyperparameter search.
  - No S4 or additional seed is permitted unless this stop condition passes.
execution:
  optimizer_steps: 200
  validation_interval_steps: 40
  validation_samples: 240000
fssr_model:
  taps: 17
  num_knots: 17
  slow_hidden_size: 8
  slow_decimation: 64
  residual_channels: 31
  oversampling_filter_taps: 33
