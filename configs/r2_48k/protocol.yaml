schema_version: 1
campaign_version: FSSR-R2-48K-v1
parent_campaign: FSSR-R2-v1
status: prospective_transfer_with_historical_development
base_sample_rate_hz: 48000
precision: float32
run_id_format: r2_48k_<stage>_<device>_<family>_<aa>_seed<n>_v1
valid_terminal_verdicts: [GO-R2-48K, NO-GO-R2-48K, INVALID]
external_report_only_locked: true

claim_scope:
  primary: physical_fidelity_efficiency_and_listening_at_48khz
  comparator: pinned_nam_a2_full
  global_state_of_the_art_claim_allowed: false
  physical_hardware_aliasing_claim_allowed: false
  synthetic_aliasing_mechanism_claim_allowed: true
  synthetic_reference_sample_rate_hz: 192000
  physical_reference_sample_rate_hz: 48000
  derived_192khz_hardware_reference_allowed: false
  proxy_hardware_allowed: false
  prohibited_proxy_devices: [fractal_fm9]

decision:
  confidence_level: 0.95
  primary_devices: [blackstar, ua1176]
  heldout_esr_relative_improvement_lower_bound_minimum: 0.15
  devices_won_minimum: 3
  mandatory_devices: [blackstar, ua1176]
  cpp_block_size: 64
  cpp_cpu_ratio_maximum: 1.25
  added_latency_samples_maximum: 48
  primary_mushra_advantage_points_strictly_greater_than: 10.0
  primary_mushra_lower_bound_strictly_greater_than: 0.0
  synthetic_mechanism_x2_must_pass: true
  physical_asr_is_a_decision_metric: false
  valid_failure_verdict: NO-GO-R2-48K
  instrumentation_failure_verdict: INVALID

baseline:
  family: a2
  model_config: configs/models/baselines/nam_a2_full.yaml
  packed_submodel: channels_8
  losses: [m4, wright]
  selection_unit: device
  selection_metric: validation_esr
  selection_rule: minimum
  test_data_forbidden: true

architectures:
  selection_eligible_families: [aa-nam, aa-fssr, aa-fssr-xl]
  capacity_policy: no_apriori_size_cap_final_native_cost_gate_controls_deployment
  aa_nam:
    topology: pinned_a2_full
    activation: hermite_c1
    initialization: {function: CustomTanh, alpha: 1.8}
  aa_fssr:
    core: fixture_selected_mono_or_cascade
    two_clippers_cascade_improvement_minimum: 0.50
    receptive_field_samples_at_48khz: 2047
    residual_channels: 16
    slow_gru_units: 16
    slow_cadence_samples_at_48khz: 64
  aa_fssr_xl:
    admission: versioned_admission_from_r2_v1_exploration
    core: cascade
    fir_taps: 65
    spline_knots: 129
    receptive_field_samples_at_48khz: 2047
    residual_channels: 16
    slow_gru_units: 16
    slow_cadence_samples_at_48khz: 64
  aa_modes:
    primary: full_island_x2
    challenger: adaa1
    teacher: teacher_x4
  full_island:
    factors: [2, 4]
    one_resampler_pair: true
    causal_alignment: true
    deployable_latency_samples: 16
    preserve_physical_horizons: true
  adaa1:
    primitive: analytic_hermite
    difference_limit_threshold: 0.0001
    maximum_aligned_latency_samples: 48
    reject_route_on_phase_alignment_failure: true

data:
  config: configs/data/r2_48k_archive.yaml
  source_manifest: datasets/manifests/r1_physical.json
  new_capture_required: false
  development_devices: [fulltone, bigmuff]
  development_outputs_previously_observed: true
  internal_validation_devices: [blackstar, ua1176]
  primary_test_devices: [blackstar, ua1176]
  final_report_devices: [fulltone, bigmuff, blackstar, ua1176]
  internal_validation_train_and_validation_locked_until_confirmatory_lock: true
  internal_validation_tests_sealed_until_cpp_parity_and_benchmark: true
  internal_validation_test_open_count_maximum: 1
  source_file_boundaries_preserved: true
  no_independent_normalization: true
  limitations:
    - fulltone_and_bigmuff_are_historical_development_not_fresh_holdouts
    - bigmuff_has_file_level_not_performance_level_split_provenance
    - primary_source_uncertainty_is_limited_by_one_blackstar_and_two_ua_test_sources

mechanism:
  evidence_tier: SYNTHETIC
  fixtures:
    - tanh
    - asymmetric_clipping
    - two_clippers
    - short_memory
    - slow_sag
    - rf2047_residual
  rf2047_residual_energy_ratio_minimum: 0.10
  modes: [off, full_island_x2, adaa1, teacher_x4]
  same_weights_across_modes: true
  reference_kind: synthetic_192khz
  reference_sample_rate_hz: 192000
  spearman_rho_minimum: 0.90
  median_asr_gain_db_minimum: 10.0
  per_fixture_asr_gain_db_minimum: 6.0
  fundamental_complex_error_maximum: 0.00001
  x2_failure_action: stop_r2_48k
  adaa_failure_action: reject_adaa_only
  supports_hardware_aliasing_claim: false

screening:
  data_tier: INTERNAL_DEV
  devices: [fulltone, bigmuff]
  families: [aa-nam, aa-fssr, aa-fssr-xl]
  baseline_family: a2
  losses: [m4, wright]
  losses_are_existing_unmodified: true
  initial_seed: 0
  initial_x2_trajectories: 12
  baseline_trajectories: 4
  adaa_challenger_trajectories_maximum: 6
  non_promoted_loss_stop_updates: 5000
  promoted_loss_final_updates: 15000
  checkpoints: [200, 1000, 5000, 15000]
  selection_data: validation
  selection_metrics: [esr]
  physical_asr_selection_forbidden: true
  loss_promotion:
    metric: median_validation_esr_at_5000_updates
    aggregation: across_initial_x2_families_and_devices
    rule: minimum
    exact_tie_breaker: m4
  promotion:
    ranking: highest_median_esr_improvement_then_lowest_projected_cpu
    deployable_esr_relative_improvement_minimum_each_device: 0.15
    selected_topology_continues_to_teacher_even_if_deployable_gate_fails: true

teacher_and_distillation:
  teacher_aa_mode: teacher_x4
  teacher_internal_sample_rate_hz: 192000
  physical_target_sample_rate_hz: 48000
  teacher_role: model_side_regularizer_not_hardware_reference
  seed: 0
  devices: [fulltone, bigmuff]
  teacher_esr_improvement_minimum_each_device: 0.15
  teacher_failure_verdict: NO-GO-R2-48K
  distill_only_if_teacher_passes_and_deployable_fidelity_fails: true
  distillation_loss:
    physical_loss_weight: 1.0
    teacher_esr_preemphasis_weight: 0.25
    teacher_target: downsampled_teacher

confirmation:
  development_additional_seeds: [1, 2, 3, 4]
  internal_validation_seeds: [0, 1, 2, 3, 4]
  families: [a2, candidate]
  devices: [fulltone, bigmuff, blackstar, ua1176]
  evaluation_conditions: 40
  prospective_conditions: 20
  historical_development_conditions: 20
  no_tuning_on_internal_validation: true
  freeze_before_internal_validation:
    - architecture
    - loss
    - code
    - data
    - checkpoints
    - metrics
    - export
  bootstrap:
    replicates: 10000
    seed: 20260828
    hierarchy: [seed, source]
    primary_devices: [blackstar, ua1176]
    development_devices_excluded_from_primary_interval: true
    windows_are_observations: false
    probes_are_observations: false
    inference_limit: available_training_seeds_and_archived_sources_only

physical_asr:
  status: diagnostic_only
  selection_allowed: false
  final_decision_allowed: false
  reason: no_physical_reference_above_48khz

synthetic_asr:
  method: sato_smith
  sample_rate_hz: 48000
  dft_samples: 65536
  fft_window: none
  zero_padding: false
  k0: [1705, 8191, 12287]
  amplitudes: [0.10, 0.25, 0.48]
  frames: 6
  analyzed_frame: 6
  periodicity_comparison_frames: [6, 5]
  periodicity_error_db_maximum: -60.0
  guards:
    finite_output: true
    nonconstant_output: true
    gain_error_strictly_greater_than: -0.2
    correlation_strictly_greater_than: 0.9
    fundamental_level_delta_db_maximum: 0.5
    harmonic_energy_delta_db_maximum: 0.5
    complex_harmonic_error_regression_maximum: 0.05
    ablation_reference: aa_off

benchmark:
  implementation: cpp
  same_binary: true
  abi: float32
  compiler_optimization: -Ofast
  lto_ipo: true
  same_isa: true
  block_sizes: [1, 16, 64, 128]
  primary_block_size: 64
  repetitions: 30
  schedule: interleaved_ab
  allocations_outside_timing: true
  required_fields:
    - median
    - p95
    - rtf
    - parameters
    - weight_bytes
    - persistent_state_bytes
    - scratch_bytes
    - latency_samples
  python_cpp_max_abs_error: 0.00002

listening:
  standard: ITU-R BS.1534-3
  launch_requires: [heldout_esr_passed, synthetic_mechanism_passed, cpu_passed]
  recruited_participants: 24
  retained_participants_minimum: 20
  excerpts_total: 8
  primary_excerpts: 4
  development_secondary_excerpts: 4
  excerpts_per_device: 2
  excerpt_duration_seconds: 10
  primary_devices: [blackstar, ua1176]
  development_secondary_devices: [fulltone, bigmuff]
  conditions:
    - hidden_hardware_reference
    - candidate
    - a2
    - aa_off_ablation
    - lowpass_anchor_3p5khz
    - aliasing_anchor
  double_blind: true
  randomized_order: true
  one_global_gain_per_trial: true
  preregistered_exclusion_rule: configs/r2_48k/mushra_exclusion.yaml
  bootstrap:
    replicates: 10000
    seed: 20260829
    hierarchy: [participant, primary_excerpt]

export:
  implementation_format: fssr-r2-native-v1
  format_reused_without_scientific_semantic_change: true
  families: [aa-nam, aa-fssr, aa-fssr-xl]
  required_fields:
    - family
    - aa_mode
    - internal_sample_rate
    - dilation_scale
    - latency_samples
    - parameters
    - weight_bytes
    - persistent_state_bytes
    - scratch_bytes

references:
  smooth_activations_asr: https://www.dafx.de/paper-archive/2025/DAFx25_paper_50.pdf
  multirate_neural_resampling: https://research.aalto.fi/en/publications/resampling-filter-design-for-multirate-neural-audio-effect-proces/
  stateful_adaa: https://www.dafx.de/paper-archive/2019/DAFx2019_paper_4.pdf
  mushra: https://www.itu.int/rec/R-REC-BS.1534-3-201510-I/en
