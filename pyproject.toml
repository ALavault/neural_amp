[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fssr-nam"
version = "0.1.0"
description = "Reproducible Fast-Slow Structured Residual NAM research campaign"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
baseline = [
  "neural-amp-modeler @ git+https://github.com/sdatkinson/neural-amp-modeler.git@f26112906de06ec6b796ad6d1982e29eed83144e",
]
ml = [
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "pytorch-lightning>=2.5,<=2.6.1",
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fssr_nam"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The deck generator holds the French slide copy and the page stylesheet:
# typographic apostrophes and CSS line lengths are not Python style issues.
"scripts/product_deck.py" = ["E501", "RUF001"]
# Same case: the listening page generator holds the HTML template and the French copy.
"scripts/product_butterfly_listening.py" = ["E501", "RUF001"]
